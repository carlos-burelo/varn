name: CI

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."

      - name: Verify Formatting (cargo fmt)
        run: cargo fmt --all -- --check || echo "Formatting differences noted."

      - name: Lint Workspace (cargo clippy)
        run: cargo clippy --workspace --all-targets

      - name: Anti-God File Governance Check
        run: |
          echo "Scanning Rust source files for line count limits..."
          FAIL=0
          while IFS= read -r file; do
            LINES=$(wc -l < "$file")
            if [ "$LINES" -gt 1000 ]; then
              echo "::error file=$file::File exceeds 1000 lines ($LINES lines). Governance rule forbids files > 1000 lines."
              FAIL=1
            elif [ "$LINES" -gt 700 ]; then
              echo "::warning file=$file::File has $LINES lines (>700 lines). Modularization refactoring recommended."
            fi
          done < <(find crates -name "*.rs")
          if [ $FAIL -ne 0 ]; then
            exit 1
          fi

  test-matrix:
    name: Test Matrix (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
            bin_path: ./target/release/vn
          - name: Windows x86_64
            os: windows-latest
            bin_path: ./target/release/vn.exe
          - name: macOS Apple Silicon
            os: macos-14
            bin_path: ./target/release/vn
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."

      - name: Build Release Binary
        run: cargo build --release --bin vn

      - name: Quadrant 1 (dev-checkout + JIT)
        run: ${{ matrix.bin_path }} run ./tests/main.vn

      - name: Quadrant 2 (dev-checkout + No-JIT)
        env:
          VARN_NO_JIT: "1"
        run: ${{ matrix.bin_path }} run ./tests/main.vn

      - name: Quadrant 3 (@embedded + JIT)
        env:
          VARN_STD: "@embedded"
        run: ${{ matrix.bin_path }} run ./tests/main.vn

      - name: Quadrant 4 (@embedded + No-JIT)
        env:
          VARN_STD: "@embedded"
          VARN_NO_JIT: "1"
        run: ${{ matrix.bin_path }} run ./tests/main.vn


      # NOTE: macOS Apple Silicon (aarch64) runs entirely in the interpreter —
      # Cranelift JIT does not compile functions on that target in CI. The bench
      # step below will show 0% Cranelift coverage on that runner. This is a
      # known platform gap; correctness is still fully validated by the 4
      # quadrants above. Do not interpret slow bench numbers on macOS as a
      # regression unless the same workload regresses on Linux or Windows.
      - name: Stability Benchmark
        run: ${{ matrix.bin_path }} bench ./tests/benchmarks/bench_fib.vn -v

  # Runs only on direct push to main (not on PRs).
  # Builds dist binaries for all 5 targets and publishes a GitHub Release.
  # Uses GITHUB_TOKEN directly — no PAT, no cross-workflow trigger needed.
  # Skips publishing if the version tag already exists (idempotent).
  release:
    name: Release (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    needs: [lint, test-matrix]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin_name: vn.exe
            archive_type: zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin_name: vn
            archive_type: tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            bin_name: vn
            archive_type: tar.gz
          - os: macos-13
            target: x86_64-apple-darwin
            bin_name: vn
            archive_type: tar.gz
          - os: macos-14
            target: aarch64-apple-darwin
            bin_name: vn
            archive_type: tar.gz
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version and check tag
        id: ver
        shell: bash
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*= "\(.*\)"/\1/')
          TAG="v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG"         >> "$GITHUB_OUTPUT"
          if git ls-remote --tags origin | grep -q "refs/tags/${TAG}$"; then
            echo "exists=true"  >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Rust toolchain
        if: steps.ver.outputs.exists == 'false'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        if: steps.ver.outputs.exists == 'false'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
          key: ${{ matrix.target }}-dist

      - name: Build dist binary
        if: steps.ver.outputs.exists == 'false'
        run: cargo build --profile dist --bin vn --target ${{ matrix.target }}

      - name: Smoke test (Windows)
        if: steps.ver.outputs.exists == 'false' && matrix.archive_type == 'zip'
        shell: pwsh
        run: |
          & "target/${{ matrix.target }}/dist/${{ matrix.bin_name }}" --version
          & "target/${{ matrix.target }}/dist/${{ matrix.bin_name }}" run ./tests/main.vn

      - name: Smoke test (Unix)
        if: steps.ver.outputs.exists == 'false' && matrix.archive_type == 'tar.gz'
        shell: bash
        run: |
          chmod +x "target/${{ matrix.target }}/dist/${{ matrix.bin_name }}"
          "./target/${{ matrix.target }}/dist/${{ matrix.bin_name }}" --version
          "./target/${{ matrix.target }}/dist/${{ matrix.bin_name }}" run ./tests/main.vn

      - name: Package (Unix)
        if: steps.ver.outputs.exists == 'false' && matrix.archive_type == 'tar.gz'
        shell: bash
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          DIST_DIR="dist/vn-${TAG}-${{ matrix.target }}"
          mkdir -p "$DIST_DIR"
          cp "target/${{ matrix.target }}/dist/${{ matrix.bin_name }}" "$DIST_DIR/"
          cp README.md "$DIST_DIR/" 2>/dev/null || true
          cp LICENSE   "$DIST_DIR/" 2>/dev/null || true
          ARCHIVE_NAME="vn-${TAG}-${{ matrix.target }}.tar.gz"
          tar -czvf "$ARCHIVE_NAME" -C dist "vn-${TAG}-${{ matrix.target }}"
          echo "ARCHIVE_PATH=$ARCHIVE_NAME" >> "$GITHUB_ENV"

      - name: Package (Windows)
        if: steps.ver.outputs.exists == 'false' && matrix.archive_type == 'zip'
        shell: pwsh
        run: |
          $tag     = "${{ steps.ver.outputs.tag }}"
          $distDir = "dist/vn-$tag-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path $distDir | Out-Null
          Copy-Item "target/${{ matrix.target }}/dist/${{ matrix.bin_name }}" -Destination $distDir
          if (Test-Path "README.md") { Copy-Item "README.md" -Destination $distDir }
          if (Test-Path "LICENSE")   { Copy-Item "LICENSE"   -Destination $distDir }
          $archiveName = "vn-$tag-${{ matrix.target }}.zip"
          Compress-Archive -Path "$distDir/*" -DestinationPath $archiveName -Force
          echo "ARCHIVE_PATH=$archiveName" >> $env:GITHUB_ENV

      - name: Upload artifact
        if: steps.ver.outputs.exists == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: vn-*.*

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve version and check tag
        id: ver
        shell: bash
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*= "\(.*\)"/\1/')
          TAG="v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG"         >> "$GITHUB_OUTPUT"
          if git ls-remote --tags origin | grep -q "refs/tags/${TAG}$"; then
            echo "exists=true"  >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all artifacts
        if: steps.ver.outputs.exists == 'false'
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate checksums
        if: steps.ver.outputs.exists == 'false'
        working-directory: release-assets
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        if: steps.ver.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
