name: CI

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."

      - name: Verify Formatting (cargo fmt)
        run: cargo fmt --all -- --check || echo "Formatting differences noted."

      - name: Lint Workspace (cargo clippy)
        run: cargo clippy --workspace --all-targets

      - name: Anti-God File Governance Check
        run: |
          echo "Scanning Rust source files for line count limits..."
          FAIL=0
          while IFS= read -r file; do
            LINES=$(wc -l < "$file")
            if [ "$LINES" -gt 1000 ]; then
              echo "::error file=$file::File exceeds 1000 lines ($LINES lines). Governance rule forbids files > 1000 lines."
              FAIL=1
            elif [ "$LINES" -gt 700 ]; then
              echo "::warning file=$file::File has $LINES lines (>700 lines). Modularization refactoring recommended."
            fi
          done < <(find crates -name "*.rs")
          if [ $FAIL -ne 0 ]; then
            exit 1
          fi

  test-matrix:
    name: Test Matrix (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
            bin_path: ./target/release/vn
          - name: Windows x86_64
            os: windows-latest
            bin_path: ./target/release/vn.exe
          - name: macOS Apple Silicon
            os: macos-14
            bin_path: ./target/release/vn
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."

      - name: Build Release Binary
        run: cargo build --release --bin vn

      - name: Quadrant 1 (dev-checkout + JIT)
        run: ${{ matrix.bin_path }} run ./tests/main.vn

      - name: Quadrant 2 (dev-checkout + No-JIT)
        env:
          VARN_NO_JIT: "1"
        run: ${{ matrix.bin_path }} run ./tests/main.vn

      - name: Quadrant 3 (@embedded + JIT)
        env:
          VARN_STD: "@embedded"
        run: ${{ matrix.bin_path }} run ./tests/main.vn

      - name: Quadrant 4 (@embedded + No-JIT)
        env:
          VARN_STD: "@embedded"
          VARN_NO_JIT: "1"
        run: ${{ matrix.bin_path }} run ./tests/main.vn


      # NOTE: macOS Apple Silicon (aarch64) runs entirely in the interpreter —
      # Cranelift JIT does not compile functions on that target in CI. The bench
      # step below will show 0% Cranelift coverage on that runner. This is a
      # known platform gap; correctness is still fully validated by the 4
      # quadrants above. Do not interpret slow bench numbers on macOS as a
      # regression unless the same workload regresses on Linux or Windows.
      - name: Stability Benchmark
        run: ${{ matrix.bin_path }} bench ./tests/benchmarks/bench_fib.vn -v

  # Runs only on direct push to main (not on PRs).
  # Reads the workspace version from Cargo.toml and pushes a "vX.Y.Z" tag if
  # it does not already exist, which in turn triggers release.yml.
  auto-tag:
    name: Auto-tag release
    runs-on: ubuntu-latest
    needs: [lint, test-matrix]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create version tag if new
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*= "\(.*\)"/\1/')
          TAG="v$VERSION"
          if git ls-remote --tags origin | grep -q "refs/tags/${TAG}$"; then
            echo "Tag $TAG already exists — skipping."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag "$TAG"
            git push origin "$TAG"
            echo "Pushed tag $TAG — release.yml will publish binaries."
          fi
