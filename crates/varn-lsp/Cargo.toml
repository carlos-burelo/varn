[package]
name = "varn-lsp"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "vn-lsp"
path = "src/main.rs"

[dependencies]
varn-core    = { path = "../varn-core" }
varn-lexer   = { path = "../varn-lexer" }
varn-parser  = { path = "../varn-parser" }
varn-checker = { path = "../varn-checker" }
varn-modules  = { path = "../varn-modules" }
varn-builtins = { path = "../varn-builtins" }

tower-lsp  = "0.20"
tokio      = { version = "1", features = ["full"] }
serde_json = "1"
dashmap    = "5"
once_cell  = "1"
rustc-hash = { workspace = true }
