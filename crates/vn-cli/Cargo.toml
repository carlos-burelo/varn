[package]
name = "vn-cli"
version.workspace = true
edition.workspace = true


[[bin]]
name = "vn"
path = "src/main.rs"

[features]
default = ["clif"]
clif = ["vn-jit/clif", "vn-vm/clif", "vn-debug/clif"]
embed-std = []
# Real heap profiling (dhat-rs), for when RSS doesn't add up to counted
# structures — mimalloc retains freed pages instead of returning them to the
# OS, so `Task Manager`/`GetProcessMemoryInfo` numbers can include a lot of
# allocator slack that isn't live Rust data at all. dhat's allocator tracks
# exactly what's live and dumps dhat-heap.json on clean exit (Viewable at
# https://nnethercote.github.io/dh_view/dh_view.html). Mutually exclusive
# with mimalloc — see main.rs's #[global_allocator] cfg split.
dhat-heap = ["dep:dhat"]

[dependencies]
vn-pipeline = { path = "../vn-pipeline" }
vn-core     = { path = "../vn-core" }
vn-lexer    = { path = "../vn-lexer" }
vn-parser   = { path = "../vn-parser", features = ["profiling"] }
vn-compiler = { path = "../vn-compiler" }
vn-vm       = { path = "../vn-vm", features = ["profiling"] }
vn-builtins = { path = "../vn-builtins", features = ["runtime"] }
vn-types    = { path = "../vn-types" }
vn-sem      = { path = "../vn-sem" }
vn-inspect  = { path = "../vn-inspect" }
vn-debug    = { path = "../vn-debug" }
vn-lsp      = { path = "../vn-lsp" }
vn-dap      = { path = "../vn-dap" }
vn-pm       = { path = "../vn-pm" }
vn-project  = { path = "../vn-project" }
vn-modules  = { path = "../vn-modules" }
vn-jit      = { path = "../vn-jit" }
postcard      = { workspace = true }
serde         = { workspace = true }
serde_json    = { workspace = true }
clap          = { version = "4", features = ["derive"] }
clap_complete = "4"
shlex = "1.3"
rustc-hash    = { workspace = true }
mimalloc = "0.1.52"
dhat     = { version = "0.3", optional = true }

[lints]
workspace = true
