[package]
name = "varn-checker"
version.workspace = true
edition.workspace = true

[dependencies]
varn-core     = { path = "../varn-core" }
varn-lexer    = { path = "../varn-lexer" }
varn-parser   = { path = "../varn-parser" }
varn-modules  = { path = "../varn-modules" }
varn-tir      = { path = "../varn-tir" }
# The native-global layout the compiler emits `LoadNativeGlobalIdx` against.
# `default-features = false` keeps the heavy stdlib crates out of the checker.
varn-builtins = { path = "../varn-builtins", default-features = false }
rustc-hash   = { workspace = true }
serde        = { workspace = true, features = ["rc"] }
postcard     = { workspace = true }

[lints]
workspace = true
