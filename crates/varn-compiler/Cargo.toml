[package]
name = "varn-compiler"
version.workspace = true
edition.workspace = true

# The compiler: AST -> HIR -> SSA -> opt passes -> bytecode (FunctionProto).
# Depends only on the AST (varn-core) and the bytecode/proto types (varn-types).
# `compile_module` is the front door; the VM/JIT consume the FunctionProto it
# emits. The register-allocation post-passes live in varn-regalloc.
[dependencies]
varn-core  = { path = "../varn-core" }
varn-types = { path = "../varn-types" }
rustc-hash = { workspace = true }
rust_decimal = { workspace = true }

[lints]
workspace = true
