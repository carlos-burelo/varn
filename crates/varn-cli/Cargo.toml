[package]
name = "varn-cli"
version.workspace = true
edition.workspace = true


[[bin]]
name = "vn"
path = "src/main.rs"

# Dev-only inspection tool: gated so a normal build does not pay for it.
# Build with `cargo build -p varn-cli --features dev-tools --bin debug_binder`.
[[bin]]
name = "debug_binder"
path = "src/debug_binder.rs"
required-features = ["dev-tools"]

[features]
default = ["lsp"]
dev-tools = []
lsp = ["dep:varn-lsp", "dep:tower-lsp-f"]
# Real heap profiling (dhat-rs), for when RSS doesn't add up to counted
# structures — mimalloc retains freed pages instead of returning them to the
# OS, so `Task Manager`/`GetProcessMemoryInfo` numbers can include a lot of
# allocator slack that isn't live Rust data at all. dhat's allocator tracks
# exactly what's live and dumps dhat-heap.json on clean exit (Viewable at
# https://nnethercote.github.io/dh_view/dh_view.html). Mutually exclusive
# with mimalloc — see main.rs's #[global_allocator] cfg split.
dhat-heap = ["dep:dhat"]

[dependencies]
varn-fmt = { path = "../varn-fmt" }
varn-pipeline = { path = "../varn-pipeline" }
varn-core     = { path = "../varn-core" }
varn-lexer    = { path = "../varn-lexer" }
varn-parser   = { path = "../varn-parser", features = ["profiling"] }
varn-checker  = { path = "../varn-checker" }
varn-compiler = { path = "../varn-compiler" }
varn-vm       = { path = "../varn-vm", features = ["profiling"] }
varn-builtins = { path = "../varn-builtins", features = ["runtime"] }
varn-types    = { path = "../varn-types" }
varn-debug    = { path = "../varn-debug" }
varn-lsp      = { path = "../varn-lsp", optional = true }
varn-dap      = { path = "../varn-dap" }
varn-pm       = { path = "../varn-pm" }
varn-modules  = { path = "../varn-modules" }
varn-jit      = { path = "../varn-jit" }
tower-lsp-f   = { workspace = true, optional = true }
postcard      = { workspace = true }
clap          = { version = "4", features = ["derive"] }
clap_complete = "4"
rustc-hash    = { workspace = true }
mimalloc = "0.1.52"
dhat     = { version = "0.3", optional = true }

[build-dependencies]
varn-pipeline = { path = "../varn-pipeline" }
varn-modules  = { path = "../varn-modules" }
varn-builtins = { path = "../varn-builtins" }

[lints]
workspace = true
