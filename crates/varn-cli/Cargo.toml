[package]
name = "varn-cli"
version = "0.1.0"
edition = "2021"


[[bin]]
name = "vn"
path = "src/main.rs"

[dependencies]
varn-diagnostics = { path = "../varn-diagnostics" }
varn-core     = { path = "../varn-core" }
varn-lexer    = { path = "../varn-lexer" }
varn-parser   = { path = "../varn-parser", features = ["profiling"] }
varn-checker  = { path = "../varn-checker" }
varn-compiler = { path = "../varn-compiler" }
varn-vm       = { path = "../varn-vm", features = ["profiling"] }
varn-builtins = { path = "../varn-builtins", features = ["runtime"] }
# varn-lsp      = { path = "../varn-lsp" }
varn-modules  = { path = "../varn-modules" }
varn-types    = { path = "../varn-types" }
varn-debug    = { path = "../varn-debug" }
varn-pm       = { path = "../varn-pm" }
tower-lsp    = { version = "0.20" }
postcard = { version = "1", features = ["alloc"] }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
rustc-hash = "2.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
varn-lexer    = { path = "../varn-lexer" }
varn-parser   = { path = "../varn-parser" }
varn-compiler = { path = "../varn-compiler" }
varn-modules  = { path = "../varn-modules" }
postcard = { version = "1", features = ["alloc"] }
