[workspace]
members = [
    "crates/varn-core",
    "crates/varn-lexer",
    "crates/varn-parser",
    "crates/varn-checker",
    "crates/varn-types",
    "crates/varn-op-macros",
    "crates/varn-modules",
    "crates/varn-builtins",
    "crates/varn-runtime",
    "crates/varn-cli",
    "crates/varn-lsp",
    "crates/varn-vm",
    "crates/varn-debug",
    "crates/varn-pm",
    "crates/varn-jit",
    "crates/varn-pipeline",
    "crates/varn-term",
    "crates/varn-compiler",
    "crates/varn-regalloc",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
rustc-hash   = "1.1.0"
rust_decimal = { version = "1", features = ["serde", "maths"] }
parking_lot  = "0.12.5"
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
tower-lsp    = "0.20"
ryu          = "1.0"
postcard     = { version = "1", features = ["alloc"] }
tokio        = { version = "1", features = ["full"] }
semver       = "1"
sha2         = "0.10"
hex          = "0.4"

# `unused_crate_dependencies` is the automated form of the manifest audit:
# a declared dependency no crate target imports becomes a warning instead of
# silent build-graph weight.
[workspace.lints.rust]
unused_crate_dependencies = "warn"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
panic = "abort"

[profile.dev]
opt-level = 1

# Fast-iteration optimized build: keeps opt-level 3 for representative
# JIT/VM perf, but thin LTO + parallel codegen ~= 2x faster rebuilds.
# Use `cargo build --profile quick` while iterating on the perf branch;
# keep `release` for final benchmarks / distribution.
[profile.quick]
inherits = "release"
lto = "thin"
codegen-units = 16
