[workspace]
members = [
    "crates/varn-core",
    "crates/varn-lexer",
    "crates/varn-parser",
    "crates/varn-checker",
    "crates/varn-types",
    "crates/varn-op-macros",
    "crates/varn-modules",
    "crates/varn-builtins",
    "crates/varn-runtime",
    "crates/varn-cli",
    "crates/varn-lsp",
    "crates/varn-diagnostics",
    "crates/varn-vm",
    "crates/varn-debug",
    "crates/varn-base",
    "crates/varn-pm",
    "crates/varn-jit",
    "crates/varn-pipeline",
    "crates/varn-utilities",
    "crates/varn-opt",
    "crates/varn-backend",
    "xtask",
]
resolver = "2"

[workspace.dependencies]
rustc-hash   = "1.1.0"
rust_decimal = { version = "1", features = ["serde", "maths"] }
parking_lot  = "0.12.5"
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
tower-lsp    = "0.20"
ryu          = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.release.package.varn-jit]
opt-level = 3

[profile.release.package.varn-vm]
opt-level = 3

[profile.dev]
opt-level = 1

# Fast-iteration optimized build: keeps opt-level 3 for representative
# JIT/VM perf, but thin LTO + parallel codegen ~= 2x faster rebuilds.
# Use `cargo build --profile quick` while iterating on the perf branch;
# keep `release` for final benchmarks / distribution.
[profile.quick]
inherits = "release"
lto = "thin"
codegen-units = 16
