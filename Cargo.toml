[workspace]
members = [
    "crates/varn-core",
    "crates/varn-lexer",
    "crates/varn-parser",
    "crates/varn-checker",
    "crates/varn-types",
    "crates/varn-op-macros",
    "crates/varn-modules",
    "crates/varn-builtins",
    "crates/varn-runtime",
    "crates/varn-cli",
    "crates/varn-lsp",
    "crates/varn-vm",
    "crates/varn-debug",
    "crates/varn-pm",
    "crates/varn-jit",
    "crates/varn-pipeline",
    "crates/varn-compiler",
    "crates/xtask",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
rustc-hash   = "1.1.0"
rust_decimal = { version = "1", features = ["serde", "maths"] }
parking_lot  = "0.12.5"
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
tower-lsp    = "0.20"
ryu          = "1.0"
postcard     = { version = "1", features = ["alloc"] }
tokio        = { version = "1", features = ["full"] }
semver       = "1"
sha2         = "0.10"
hex          = "0.4"
mio          = { version = "1.0", features = ["net", "os-poll"] }
httparse     = { version = "1.9", default-features = false, features = ["std"] }
toml         = "0.8"
# SIMD substring search. Already in the build graph via `serde_json`, so this
# is a new edge rather than new code: `str::find` uses the scalar Two-Way
# algorithm, and `indexOf`/`includes` over a large haystack is the one place
# that difference is measurable.
memchr       = "2"
regex        = "1.10"
flate2       = "1.0"
rusqlite     = { version = "0.31", features = ["bundled"] }
tar          = "0.4"
zip          = { version = "2.2", default-features = false, features = ["deflate"] }
tungstenite  = "0.21"

# `unused_crate_dependencies` is the automated form of the manifest audit:
# a declared dependency no crate target imports becomes a warning instead of
# silent build-graph weight.
[workspace.lints.rust]
unused_crate_dependencies = "warn"

[workspace.lints.clippy]
too_many_arguments = "allow"
arc_with_non_send_sync = "allow"
needless_borrow = "allow"
should_implement_trait = "allow"
box_collection = "allow"
collapsible_match = "allow"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.release.build-override]
opt-level = 0

[profile.dev]
opt-level = 1
debug = 0

# Optimize all 3rd-party dependencies in dev so Cranelift, SQLite, Tokio
# run at full speed without slowing down workspace crate compilation.
[profile.dev.package."*"]
opt-level = 3

[profile.dev.build-override]
opt-level = 0

# Fast-iteration optimized build: keeps opt-level 3 for representative
# JIT/VM perf, but disables LTO for instant linking.
# Use `cargo build --profile quick --bin vn` while iterating.
[profile.quick]
inherits = "release"
opt-level = 3
lto = false
codegen-units = 16
debug = 0

[profile.quick.build-override]
opt-level = 0

# Distribution profile: maximum optimization for published binaries.
# Used by CI/CD release.yml. Slower to compile than `release` but produces
# the smallest, fastest binaries for end users.
[profile.dist]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.dist.build-override]
opt-level = 0
