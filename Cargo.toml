[workspace]
members = [
    "crates/varn-core",
    "crates/varn-lexer",
    "crates/varn-parser",
    "crates/varn-checker",
    "crates/varn-compiler",
    "crates/varn-types",
    "crates/varn-op-macros",
    "crates/varn-modules",
    "crates/varn-builtins",
    "crates/varn-runtime",
    "crates/varn-cli",
    "crates/varn-lsp",
    "crates/varn-diagnostics",
    "crates/varn-vm",
    "crates/varn-debug",
    "crates/varn-base",
    "crates/varn-pm",
    "crates/varn-jit",
    "crates/varn-pipeline",
    "crates/varn-utilities",
    "crates/varn-opt",
]
resolver = "2"

[workspace.dependencies]
rustc-hash   = "1.1.0"
rust_decimal = { version = "1", features = ["serde", "maths"] }
parking_lot  = "0.12.5"
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
tower-lsp    = "0.20"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.release.package.varn-jit]
opt-level = 3

[profile.release.package.varn-vm]
opt-level = 3

[profile.dev]
opt-level = 1
